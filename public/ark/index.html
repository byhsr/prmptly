<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ark — visual flow designer</title>
<meta name="description" content="Ark — a free-form flow designer that runs in your browser. Nested canvases, local storage, JSON import/export and shareable links.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%2317171a'/><path d='M9 9.5h8.5a5.5 5.5 0 0 1 0 11H12' stroke='%23f1f1f4' stroke-width='2.4' fill='none' stroke-linecap='round'/><circle cx='12' cy='9.5' r='2.6' fill='%23f1f1f4'/><circle cx='12' cy='20.5' r='2.6' fill='%23f1f1f4'/></svg>">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app" id="app">

  <nav class="crumbs" id="crumbs" aria-label="Canvas path"></nav>

  <main class="workspace">
    <header class="topbar">
      <div class="tb-group tb-left">
        <button class="icon-btn" id="btn-outline" title="Outline (Ctrl+B)" aria-label="Outline"><svg class="icon"><use href="#i-panel"/></svg></button>
        <span class="tb-sep"></span>
        <button class="canvas-pill" id="canvas-menu" title="Canvas actions — new, rename, delete">
          <svg class="icon"><use href="#i-layers"/></svg>
          <span class="canvas-pill-name" id="canvas-name">Main flow</span>
          <svg class="icon caret"><use href="#i-chevron-down"/></svg>
        </button>
      </div>

      <div class="tb-group tb-right">
        <button class="icon-btn" id="btn-undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg class="icon"><use href="#i-undo"/></svg></button>
        <button class="icon-btn" id="btn-redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg class="icon"><use href="#i-redo"/></svg></button>
        <button class="icon-btn" id="btn-more" title="More — share, theme, import, export" aria-label="More"><svg class="icon"><use href="#i-more"/></svg></button>
      </div>
    </header>

    <aside class="sidebar collapsed" id="sidebar">
      <div class="panel-head">
        <span class="panel-title"><svg class="icon"><use href="#i-layers"/></svg> Outline</span>
        <div class="panel-actions">
          <button class="icon-btn sm" id="btn-new-flow" title="New canvas" aria-label="New canvas"><svg class="icon"><use href="#i-plus"/></svg></button>
          <button class="icon-btn sm" id="btn-close-outline" title="Close (Ctrl+B)" aria-label="Close outline"><svg class="icon"><use href="#i-x"/></svg></button>
        </div>
      </div>
      <div class="tree" id="tree"></div>
    </aside>

    <section class="canvas-wrap" id="canvas-wrap">
      <div class="canvas" id="canvas" tabindex="0">
        <svg class="edge-svg" id="edge-svg" aria-hidden="true">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M0 0.6 L9 5 L0 9.4 z" fill="context-stroke"/>
            </marker>
          </defs>
          <g id="edge-g"></g>
          <g id="draft-g"></g>
        </svg>
        <div class="node-layer" id="node-g"></div>
        <div class="marquee" id="marquee" hidden></div>
        <div class="create-preview" id="create-preview" hidden></div>
      </div>

      <div class="dock" id="dock">
        <div class="dock-options" id="dock-options" hidden></div>
        <div class="dock-row" id="dock-tools">
          <button class="dock-tool" data-tool="select" title="Select and move (V)" aria-label="Select"><svg class="icon"><use href="#i-cursor"/></svg></button>
          <span class="dock-sep"></span>
          <button class="dock-tool" data-tool="node" title="Flow node — can hold its own canvas (N)" aria-label="Flow node"><svg class="icon"><use href="#i-node"/></svg></button>
          <button class="dock-tool" data-tool="sticky" title="Sticky note (S)" aria-label="Sticky note"><svg class="icon"><use href="#i-sticky"/></svg></button>
          <button class="dock-tool" data-tool="text" title="Text label (T)" aria-label="Text label"><svg class="icon"><use href="#i-text"/></svg></button>
          <button class="dock-tool" data-tool="shape" title="Shape (R)" aria-label="Shape"><svg class="icon"><use href="#i-shape-rect"/></svg><svg class="icon caret"><use href="#i-chevron-down"/></svg></button>
          <button class="dock-tool" data-tool="sticker" title="Sticker (E)" aria-label="Sticker"><svg class="icon"><use href="#i-sticker"/></svg></button>
          <button class="dock-tool" data-tool="group" title="Group frame — hold things together (G)" aria-label="Group frame"><svg class="icon"><use href="#i-group"/></svg></button>
          <button class="dock-tool" data-tool="preview" title="Preview node — shows a canvas as text (P)" aria-label="Preview node"><svg class="icon"><use href="#i-preview"/></svg></button>
          <span class="dock-sep"></span>
          <button class="dock-tool dock-close" id="dock-hide" title="Hide the toolbar (.)" aria-label="Hide toolbar"><svg class="icon"><use href="#i-chevron-down"/></svg></button>
        </div>
      </div>

      <button class="dock-restore" id="dock-restore" title="Show the toolbar (.)" hidden>
        <svg class="icon"><use href="#i-dock"/></svg>
      </button>

      <div class="minimap hidden" id="minimap" title="Click to jump">
        <canvas id="mm-canvas"></canvas>
      </div>
    </section>

    <div class="settings-panel" id="settings-panel" hidden>
      <div class="panel-head">
        <span class="panel-title"><svg class="icon"><use href="#i-gear"/></svg> Settings</span>
        <button class="icon-btn sm" id="btn-settings-close" title="Close" aria-label="Close settings"><svg class="icon"><use href="#i-x"/></svg></button>
      </div>
      <div class="settings-body">
        <div class="setting-row">
          <span class="setting-label">Theme</span>
          <div class="segmented">
            <button id="theme-dark">Dark</button>
            <button id="theme-light">Light</button>
          </div>
        </div>
        <label class="setting-row">
          <span class="setting-label">Snap to grid</span>
          <input type="checkbox" id="opt-snap">
          <span class="track"><span class="thumb"></span></span>
        </label>
        <label class="setting-row">
          <span class="setting-label">Animated edges</span>
          <input type="checkbox" id="opt-anim">
          <span class="track"><span class="thumb"></span></span>
        </label>
        <label class="setting-row">
          <span class="setting-label">Overview map</span>
          <input type="checkbox" id="opt-map">
          <span class="track"><span class="thumb"></span></span>
        </label>
        <p class="muted">Dots mark every 12 units; snapping uses 24. Settings are remembered in this browser.</p>
      </div>
    </div>
  </main>

  <footer class="statusbar">
    <button class="status-btn status-settings" id="btn-settings" title="Settings" aria-label="Settings" aria-pressed="false"><svg class="icon sm"><use href="#i-gear"/></svg></button>
    <span id="status-left"></span>
    <span class="spacer"></span>
    <span id="status-right"></span>
    <span class="status-controls">
      <button class="status-btn" id="status-zoom-out" title="Zoom out (Ctrl −)" aria-label="Zoom out"><svg class="icon sm"><use href="#i-minus"/></svg></button>
      <button class="status-zoom" id="status-zoom" title="Reset to 100% (Ctrl+0)">100%</button>
      <button class="status-btn" id="status-zoom-in" title="Zoom in (Ctrl +)" aria-label="Zoom in"><svg class="icon sm"><use href="#i-plus"/></svg></button>
      <span class="status-sep"></span>
      <button class="status-btn" id="status-fit" title="Fit to screen (F)" aria-label="Fit to screen"><svg class="icon sm"><use href="#i-fit"/></svg></button>
      <button class="status-btn" id="status-map" title="Overview map (M)" aria-label="Overview map" aria-pressed="false"><svg class="icon sm"><use href="#i-minimap"/></svg></button>
    </span>
  </footer>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="ctx-menu" id="menu" hidden></div>
<div class="modals" id="modals"></div>

<noscript>
  <div class="noscript">Ark needs JavaScript enabled — everything runs locally in your browser.</div>
</noscript>

<script src="js/md.js"></script>
<script src="js/store.js"></script>
<script src="js/share.js"></script>
<script src="js/render.js"></script>
<script src="js/interact.js"></script>
<script src="js/export.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
<script src="bridge.js"></script>
</body>
</html>
