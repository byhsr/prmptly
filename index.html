<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri + React + Typescript</title>
    <style>
      /* Painted before any JS runs, so a vault swap (which reloads the webview) never
         shows a white frame on the way to the in-app transition screen. */
      html {
        background: #191919;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #191919;
      }
      #boot img {
        width: 56px;
        height: 56px;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 0.4;
          transform: scale(0.97);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      /* React owns #root — as soon as it has rendered anything this splash is redundant. */
      #root:not(:empty) ~ #boot {
        display: none;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div id="boot" aria-hidden="true"><img src="/favicon.ico.png" alt="" /></div>
    <script>
      // Safety net: the splash must never mask the app, or an error screen, indefinitely.
      setTimeout(function () {
        var boot = document.getElementById("boot");
        if (boot) boot.remove();
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
